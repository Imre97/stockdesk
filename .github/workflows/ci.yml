name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://stockdesk:stockdesk@localhost:5432/stockdesk
      DIRECT_URL: postgresql://stockdesk:stockdesk@localhost:5432/stockdesk
      DATABASE_URL_TEST: postgresql://stockdesk:stockdesk@localhost:5432/stockdesk_test
      DATABASE_URL_E2E: postgresql://stockdesk:stockdesk@localhost:5432/stockdesk_e2e
      JWT_ACCESS_SECRET: ci-test-secret-not-real
      CORS_ORIGIN: http://localhost:5173
      AUTH_RATE_LIMIT_MAX: "1000"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockdesk
          POSTGRES_PASSWORD: stockdesk
          POSTGRES_DB: stockdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockdesk -d stockdesk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Create the test and e2e databases
        env:
          PGPASSWORD: stockdesk
        run: |
          psql -h localhost -U stockdesk -d postgres -c "CREATE DATABASE stockdesk_test OWNER stockdesk"
          psql -h localhost -U stockdesk -d postgres -c "CREATE DATABASE stockdesk_e2e OWNER stockdesk"

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test -- --run

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
