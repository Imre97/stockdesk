services:
  postgres:
    image: postgres:16-alpine
    container_name: stockdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockdesk
      POSTGRES_PASSWORD: stockdesk
      POSTGRES_DB: stockdesk
    ports:
      - "5432:5432"
    volumes:
      - stockdesk-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockdesk -d stockdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockdesk-postgres-data:
